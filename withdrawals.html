<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Withdrawals — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Withdrawals</div>
    <h1>Request a Withdrawal</h1>
    <p>Withdrawals are processed manually according to the published rules.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="grid grid-2">
      <div class="card">
        <h3 style="margin-bottom:6px">New withdrawal request</h3>
        <p class="card-sub" style="margin-bottom:16px">
          Available to withdraw: <strong id="availText">—</strong>
        </p>

        <div id="formError" class="alert alert-error" style="display:none"></div>
        <div id="formSuccess" class="alert alert-success" style="display:none"></div>

        <form id="wForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="amount">Amount (UGX)</label>
            <input class="form-control" id="amount" type="number" min="1" step="1000" required placeholder="e.g. 100000">
          </div>
          <div class="form-group">
            <label class="form-label" for="momo">Mobile Money number</label>
            <input class="form-control" id="momo" required placeholder="+256 7XX XXX XXX">
          </div>
          <div class="form-group">
            <label class="form-label" for="accName">Account name</label>
            <input class="form-control" id="accName" required placeholder="Name on the Mobile Money account">
          </div>
          <div class="form-group">
            <label class="form-label" for="note">Note (optional)</label>
            <textarea class="form-control" id="note" rows="3" placeholder="Any additional information"></textarea>
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="submitBtn">Submit Request</button>
        </form>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px">My withdrawal requests</h3>
        <div id="myList"><div class="skeleton sk-line"></div><div class="skeleton sk-line w60"></div></div>
      </div>
    </div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, toast, $,
           formatUGX, formatDateTime, statusBadge, emptyState, esc } from "./js/ui.js";
  import { requireAuth } from "./js/auth.js";
  import { listBy, pushItem, watch, PATH } from "./js/database.js";

  const profile = await requireAuth("login.html");
  renderHeader({ user: profile, isAdmin: profile.role === "admin" });
  renderFooter();
  renderBottomNav({ user: profile, isAdmin: profile.role === "admin" });

  let balance = profile.balance || 0;
  const availText = $("#availText");
  const updateAvail = ()=> availText.textContent = formatUGX(balance);
  updateAvail();

  // Live balance
  watch(`${PATH.users}/${profile.uid}`, (u)=>{
    balance = (u && u.balance) || 0;
    updateAvail();
  });

  const errBox = $("#formError"), okBox = $("#formSuccess");
  const showErr = m => { errBox.textContent = m; errBox.style.display = "flex"; okBox.style.display = "none"; };
  const showOk  = m => { okBox.textContent = m;  okBox.style.display = "flex"; errBox.style.display = "none"; };

  async function loadMine(){
    const list = (await listBy(PATH.withdrawals, "uid", profile.uid))
      .sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
    const el = $("#myList");
    if(!list.length){ el.innerHTML = emptyState("🏦","No withdrawal requests","Your requests will appear here."); return; }
    el.innerHTML = list.map(w=>`
      <div class="detail-row">
        <div>
          <div style="font-weight:700;font-size:.92rem">${formatUGX(w.amount)}</div>
          <div style="font-size:.75rem;color:var(--gray-400)">${formatDateTime(w.createdAt)}</div>
          <div style="font-size:.72rem;color:var(--gray-400)">${esc(w.momo||"")}</div>
        </div>
        <div>${statusBadge(w.status)}</div>
      </div>`).join("");
  }
  loadMine();
  watch(PATH.withdrawals, ()=> loadMine());

  $("#wForm").addEventListener("submit", async (e)=>{
    e.preventDefault();
    errBox.style.display = "none"; okBox.style.display = "none";

    const amount = Number($("#amount").value);
    const momo = $("#momo").value.trim();
    const accName = $("#accName").value.trim();
    const note = $("#note").value.trim();

    if(!amount || amount <= 0) return showErr("Please enter a valid amount.");
    if(amount > balance) return showErr("Amount exceeds your available balance.");
    if(!/^[+\d][\d\s-]{6,}$/.test(momo)) return showErr("Please enter a valid Mobile Money number.");
    if(!accName) return showErr("Please enter the account name.");

    const btn = $("#submitBtn");
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Submitting…`;
    try{
      await pushItem(PATH.withdrawals, {
        uid: profile.uid,
        userName: profile.name,
        userEmail: profile.email,
        amount, momo, accountName: accName, note,
        status: "PENDING",
        createdAt: Date.now(),
        processedBy: null,
        processedAt: null
      });
      showOk("Withdrawal request submitted. It will be processed manually.");
      toast("Withdrawal requested", "success");
      e.target.reset();
    }catch(err){
      showErr(err.message || "Could not submit request.");
    }finally{
      btn.disabled = false; btn.textContent = "Submit Request";
    }
  });
</script>
</body>
</html>
