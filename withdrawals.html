<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Withdrawals — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Withdrawals</div>
    <h1>Request a Withdrawal</h1>
    <p>Withdraw from Available Earnings only. Reserve funds are released at cycle settlement.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="grid grid-2">

      <div class="card">
        <h3 style="margin-bottom:6px">New withdrawal request</h3>
        <p class="card-sub" style="margin-bottom:16px">
          Available to withdraw: <strong id="availText">—</strong>
        </p>

        <div id="formError" class="alert alert-error" style="display:none"></div>
        <div id="formSuccess" class="alert alert-success" style="display:none"></div>

        <form id="wForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="amount">Amount (UGX)</label>
            <input class="form-control" id="amount" type="number" required>
            <div class="form-hint" id="amountHint">Min —</div>
          </div>
          <div class="form-group">
            <label class="form-label" for="method">Withdrawal method</label>
            <select class="form-control" id="method" required>
              <option value="MOBILE_MONEY">Mobile Money</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="accountNumber">Mobile Money number</label>
            <input class="form-control" id="accountNumber" type="tel" required placeholder="+256 7XX XXX XXX">
          </div>
          <div class="form-group">
            <label class="form-label" for="accountName">Account name</label>
            <input class="form-control" id="accountName" required placeholder="Name on the Mobile Money account">
          </div>
          <div class="form-group">
            <label class="form-label" for="note">Note (optional)</label>
            <textarea class="form-control" id="note" rows="2"></textarea>
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="submitBtn" type="submit">Submit Request</button>
        </form>
      </div>

      <div class="card">
        <h3 style="margin-bottom:12px">My withdrawal requests</h3>
        <div id="myList"><div class="skeleton sk-line"></div><div class="skeleton sk-line w60"></div></div>
      </div>
    </div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $, toast,
           formatUGX, formatDateTime, statusBadge, emptyState, esc } from "./js/ui.js";
  import { requireAuth } from "./js/auth.js";
  import { watch, PATH } from "./js/database.js";
  import { createWithdrawalRequest } from "./js/withdrawals.js";
  import { loadConfig } from "./js/config.js";

  const profile = await requireAuth("login.html");
  renderHeader({ user:profile, isAdmin:profile.role === "admin" });
  renderFooter();
  renderBottomNav({ user:profile, isAdmin:profile.role === "admin" });

  const config = await loadConfig();
  let balance = 0;

  const availText = $("#availText");
  const updateAvail = ()=> availText.textContent = formatUGX(balance);
  updateAvail();
  $("#amountHint").textContent = `Min ${formatUGX(config.minWithdrawal)}`;
  $("#amount").min = config.minWithdrawal;

  watch(`${PATH.users}/${profile.uid}`, (u)=>{
    if(!u) return;
    balance = (u.wallets?.availableEarnings) || 0;
    updateAvail();
  });

  const errBox = $("#formError"), okBox = $("#formSuccess");
  const showErr = m => { errBox.textContent = m; errBox.style.display = "flex"; okBox.style.display = "none"; };
  const showOk  = m => { okBox.textContent = m;  okBox.style.display = "flex"; errBox.style.display = "none"; };

  $("#wForm").addEventListener("submit", async e => {
    e.preventDefault();
    errBox.style.display = "none"; okBox.style.display = "none";

    const amount = Number($("#amount").value);
    const method = $("#method").value;
    const accountNumber = $("#accountNumber").value.trim();
    const accountName = $("#accountName").value.trim();
    const note = $("#note").value.trim();

    if(!amount || amount < config.minWithdrawal) return showErr(`Minimum withdrawal is ${formatUGX(config.minWithdrawal)}.`);
    if(amount > balance) return showErr("Amount exceeds available earnings.");
    if(!/^[+\d][\d\s-]{6,}$/.test(accountNumber)) return showErr("Enter a valid Mobile Money number.");
    if(!accountName) return showErr("Enter the account name.");

    const btn = $("#submitBtn");
    btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Submitting…`;
    try{
      await createWithdrawalRequest({
        uid: profile.uid, userName: profile.name, userEmail: profile.email,
        amount, method, accountNumber, accountName, note
      });
      showOk("Withdrawal request submitted. It will be reviewed manually.");
      toast("Withdrawal requested", "success");
      e.target.reset();
    }catch(err){
      showErr(err.message || "Could not submit request.");
    }finally{
      btn.disabled = false; btn.textContent = "Submit Request";
    }
  });

  watch(PATH.withdrawals, (data)=>{
    const all = data ? Object.entries(data).map(([id,v]) => ({ id, ...v })) : [];
    const mine = all.filter(w => w.uid === profile.uid)
      .sort((a,b) => (b.requestedAt||0) - (a.requestedAt||0));
    const el = $("#myList");
    if(!mine.length){ el.innerHTML = emptyState("🏦","No withdrawal requests","Your requests will appear here."); return; }
    el.innerHTML = mine.map(w => `
      <div class="detail-row">
        <div>
          <div style="font-weight:700;font-size:.92rem">${formatUGX(w.amount)}</div>
          <div style="font-size:.75rem;color:var(--gray-400)">${esc(w.accountNumber||"")} · ${formatDateTime(w.requestedAt)}</div>
          ${w.rejectionReason ? `<div style="font-size:.72rem;color:var(--red)">${esc(w.rejectionReason)}</div>` : ""}
        </div>
        <div>${statusBadge(w.status)}</div>
      </div>`).join("");
  });
</script>
</body>
</html>
