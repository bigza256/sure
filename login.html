<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Login — SURE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:13px 20px;border-radius:11px;background:#fff;
    border:1.5px solid var(--gray-200);color:var(--navy-900);
    font-weight:600;font-size:.95rem;transition:.18s;
    font-family:inherit;cursor:pointer;
  }
  .google-btn:hover{border-color:var(--gray-400);box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .google-btn:active{transform:scale(.98)}
  .google-btn:disabled{opacity:.6;cursor:not-allowed;pointer-events:none}
  .google-btn svg{flex:0 0 18px}
  .divider{
    display:flex;align-items:center;gap:12px;margin:18px 0;
    color:var(--gray-400);font-size:.72rem;text-transform:uppercase;
    letter-spacing:.6px;font-weight:600;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--gray-200)}
</style>
</head>
<body>
<div id="header"></div>

<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo" style="color:var(--navy-900)">
        <span class="logo-mark">S</span>SU<span style="color:var(--gold-dark)">RE</span>
      </span>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to track your pool and bets.</p>

    <div id="formError" class="alert alert-error" style="display:none"></div>

    <button type="button" class="google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      <span id="googleLabel">Continue with Google</span>
    </button>

    <div class="divider">or</div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" autocomplete="current-password" required placeholder="Your password">
      </div>
      <div style="display:flex;justify-content:flex-end;margin-bottom:18px">
        <a href="forgot-password.html" style="font-size:.85rem">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Sign In</button>
    </form>

    <div class="auth-foot">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
  </div>
</main>

<div id="footer"></div>

<script type="module">
  import { renderHeader, renderFooter, toast, $ } from "./js/ui.js";
  import {
    whenAuthReady, loginUser, loginWithGoogle, currentIsAdmin
  } from "./js/auth.js";

  // If already signed in, redirect to the right home page
  const existing = await whenAuthReady();
  if(existing){
    location.href = currentIsAdmin() ? "admin/index.html" : "dashboard.html";
  }

  renderHeader({});
  renderFooter();

  const errBox    = $("#formError");
  const gBtn      = $("#googleBtn");
  const gLabel    = $("#googleLabel");
  const form      = $("#loginForm");
  const submitBtn = $("#submitBtn");

  const showError = (m) => { errBox.textContent = m; errBox.style.display = "flex"; };
  const hideError = () => { errBox.style.display = "none"; };

  // Show suspended-account message if redirected with ?suspended=1
  const url = new URLSearchParams(location.search);
  if(url.get("suspended")){
    showError("This account has been suspended. Contact support.");
  }

  // ---------------------------------------------------------
  // Google Sign-In
  // ---------------------------------------------------------
  const GOOGLE_SVG = `<svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
  </svg>`;

  function resetGoogleBtn(){
    gBtn.disabled = false;
    gBtn.innerHTML = GOOGLE_SVG + `<span id="googleLabel">Continue with Google</span>`;
  }

  gBtn.addEventListener("click", async () => {
    hideError();
    gBtn.disabled = true;
    gBtn.innerHTML = `<span class="spinner dark"></span> Signing in…`;

    try{
      const result = await loginWithGoogle();

      // On mobile, loginWithGoogle starts a redirect and returns null.
      // The page navigates away and js/auth.js finishes the sign-in
      // when the user returns. Nothing else runs here.
      if(result === null) return;

      // Desktop popup flow completed
      toast("Welcome " + ((result.name || "").split(" ")[0] || "back"), "success");
      location.href = currentIsAdmin()
        ? "admin/index.html"
        : "dashboard.html";
    }catch(err){
      console.error("Google sign-in error:", err);
      const map = {
        "auth/popup-closed-by-user": "Sign-in cancelled.",
        "auth/popup-blocked": "Your browser blocked the pop-up. Please allow pop-ups for this site and try again.",
        "auth/operation-not-allowed": "Google sign-in is not enabled for this project.",
        "auth/account-exists-with-different-credential": "An account with this email already exists. Sign in with your password instead.",
        "auth/unauthorized-domain": "This domain is not authorized in Firebase. Contact the administrator.",
        "auth/network-request-failed": "Network error. Check your connection and try again."
      };
      showError(map[err.code] || err.message || "Google sign-in failed.");
      resetGoogleBtn();
    }
  });

  // ---------------------------------------------------------
  // Email + password Sign-In
  // ---------------------------------------------------------
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideError();

    const email = $("#email").value.trim();
    const pass  = $("#password").value;

    if(!email) return showError("Please enter your email.");
    if(!pass)  return showError("Please enter your password.");

    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner"></span> Signing in…`;

    try{
      const profile = await loginUser(email, pass);

      if(profile.status === "suspended"){
        showError("This account has been suspended.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In";
        return;
      }

      toast("Welcome back", "success");
      location.href = currentIsAdmin()
        ? "admin/index.html"
        : "dashboard.html";
    }catch(err){
      console.error("Login error:", err);
      const map = {
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/user-not-found": "No account found with that email.",
        "auth/wrong-password": "Incorrect password.",
        "auth/invalid-email": "That email address is not valid.",
        "auth/too-many-requests": "Too many attempts. Try again in a few minutes.",
        "auth/network-request-failed": "Network error. Check your connection and try again."
      };
      showError(map[err.code] || err.message || "Sign-in failed. Please try again.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });

  // ---------------------------------------------------------
  // Safety net — catch module load failures
  // ---------------------------------------------------------
  window.addEventListener("error", (e) => {
    if(e.message && (e.message.includes("import") || e.message.includes("module"))){
      console.error("Module load error:", e.message);
      showError("This page failed to load properly. Please refresh the page.");
    }
  });
</script>
</body>
</html>
