<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>My Bets — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / My Bets</div>
    <h1>My Bets</h1>
    <p>Your contribution-weighted share of pool betting activity.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="card" style="margin-bottom:18px">
      <div class="grid grid-4">
        <div><div class="stat-label">Your Contribution</div><div class="stat-value money" id="myContrib">—</div></div>
        <div><div class="stat-label">Contribution %</div><div class="stat-value" id="myPct">—</div></div>
        <div><div class="stat-label">Reserve</div><div class="stat-value money" id="myReserve">—</div></div>
        <div><div class="stat-label">Total Distributed</div><div class="stat-value money money-pos" id="myDist">—</div></div>
      </div>
      <div class="contrib-bar" style="margin-top:14px"><span id="myBar" style="width:0%"></span></div>
    </div>

    <div id="betsList" class="grid grid-2">
      <div class="card"><div class="skeleton sk-line"></div><div class="skeleton sk-line w80"></div></div>
    </div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $,
           formatUGX, formatDate, statusBadge, emptyState, esc } from "./js/ui.js";
  import { requireAuth } from "./js/auth.js";
  import { listAll, watch, PATH, computePoolStats } from "./js/database.js";

  const profile = await requireAuth("login.html");
  renderHeader({ user: profile, isAdmin: profile.role === "admin" });
  renderFooter();
  renderBottomNav({ user: profile, isAdmin: profile.role === "admin" });

  async function refreshMe(){
    const stats = await computePoolStats();
    const me = stats.contributors.find(c=>c.uid === profile.uid);
    const pct = me ? me.contributionPct : 0;
    $("#myContrib").textContent = formatUGX(profile.totalDeposited||0);
    $("#myPct").textContent = (pct*100).toFixed(1) + "%";
    $("#myReserve").textContent = formatUGX(profile.reserveBalance||0);
    $("#myDist").textContent = formatUGX(profile.totalDistributed||0);
    $("#myBar").style.width = (pct*100).toFixed(1) + "%";
  }
  refreshMe();

  function renderBets(bets){
    const el = $("#betsList");
    if(!bets.length){ el.innerHTML = `<div class="card" style="grid-column:1/-1">${emptyState("🎯","No bets yet","Pool bets will appear here as the admin publishes them.")}</div>`; return; }
    el.innerHTML = bets.map(b=>{
      const result = b.result || b.status;
      return `
      <div class="match-card">
        <div class="match-teams">${esc(b.match || "—")}</div>
        <div class="match-meta">
          <span>🏆 ${esc(b.competition || "—")}</span>
          <span>📅 ${formatDate(b.matchDate || b.createdAt)}</span>
          <span>${statusBadge(result)}</span>
        </div>
        <div class="match-grid">
          <div class="cell"><div class="k">Odds</div><div class="v">${esc(String(b.odds ?? "—"))}</div></div>
          <div class="cell"><div class="k">Stake</div><div class="v">${formatUGX(b.actualStake || b.plannedStake || 0)}</div></div>
          <div class="cell"><div class="k">P/L</div><div class="v ${(b.profitLoss||0)>=0?"money-pos":"money-neg"}" style="font-size:.85rem">${b.status==="completed"?formatUGX(b.profitLoss||0):"—"}</div></div>
        </div>
      </div>`;
    }).join("");
  }

  watch(PATH.bets, data=>{
    const bets = data ? Object.entries(data).map(([id,v])=>({id, ...v})) : [];
    bets.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));
    renderBets(bets);
  });

  watch(`${PATH.users}/${profile.uid}`, async (u)=>{
    if(u){
      profile.balance = u.balance; profile.reserveBalance = u.reserveBalance;
      profile.totalDeposited = u.totalDeposited; profile.totalDistributed = u.totalDistributed;
      refreshMe();
    }
  });
</script>
</body>
</html>
