<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Create Account — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .google-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
    padding:13px 20px;border-radius:11px;background:#fff;
    border:1.5px solid var(--gray-200);color:var(--navy-900);
    font-weight:600;font-size:.95rem;transition:.18s;
  }
  .google-btn:hover{border-color:var(--gray-400);box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .google-btn:active{transform:scale(.98)}
  .google-btn svg{flex:0 0 18px}
  .divider{
    display:flex;align-items:center;gap:12px;margin:18px 0;
    color:var(--gray-400);font-size:.72rem;text-transform:uppercase;
    letter-spacing:.6px;font-weight:600;
  }
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--gray-200)}
</style>
</head>
<body>
<div id="header"></div>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo" style="color:var(--navy-900)">
        <span class="logo-mark">S</span>SU<span style="color:var(--gold-dark)">RE</span>
      </span>
    </div>
    <h1>Create your account</h1>
    <p class="sub">Join SURE and start tracking your pool contribution.</p>

    <div id="formError" class="alert alert-error" style="display:none"></div>

    <button type="button" class="google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48" width="18" height="18">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <form id="regForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="name">Full name</label>
        <input class="form-control" id="name" autocomplete="name" required placeholder="e.g. John Okello">
      </div>
      <div class="form-group">
        <label class="form-label" for="phone">Phone number</label>
        <input class="form-control" id="phone" type="tel" autocomplete="tel" required placeholder="+256 7XX XXX XXX">
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" type="password" autocomplete="new-password" minlength="6" required placeholder="Min 6 characters">
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm">Confirm password</label>
          <input class="form-control" id="confirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Repeat password">
        </div>
      </div>

      <label style="display:flex;gap:10px;align-items:flex-start;margin:6px 0 18px;font-size:.85rem;color:var(--gray-600)">
        <input type="checkbox" id="agree" style="margin-top:3px">
        <span>I have read and agree to the <a href="terms.html">Terms</a> and <a href="risk-disclosure.html">Risk Disclosure</a>. I understand SURE does not guarantee profits.</span>
      </label>

      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Create Account</button>
    </form>

    <div class="auth-foot">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>
</main>
<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, toast, $ } from "./js/ui.js";
  import { whenAuthReady, registerUser, loginWithGoogle } from "./js/auth.js";

  const existing = await whenAuthReady();
  if(existing){ location.href = existing.role === "admin" ? "admin/index.html" : "dashboard.html"; }

  renderHeader({});
  renderFooter();
  renderBottomNav({});

  const errBox = $("#formError");
  const showError = m => { errBox.textContent = m; errBox.style.display = "flex"; };
  const hideError = ()=> errBox.style.display = "none";

  // --------- Google sign-up ---------
  const gBtn = $("#googleBtn");
  gBtn.addEventListener("click", async ()=>{
    hideError();
    gBtn.disabled = true;
    gBtn.innerHTML = `<span class="spinner dark"></span> Signing in…`;
    try{
      const profile = await loginWithGoogle();
      toast("Welcome to SURE, " + (profile.name || "").split(" ")[0], "success");
      // First-time Google users have no phone yet — send them to settings to complete
      if(!profile.phone){
        location.href = "settings.html?complete=phone";
      } else {
        location.href = "dashboard.html";
      }
    }catch(err){
      const map = {
        "auth/popup-closed-by-user": "Sign-in cancelled.",
        "auth/popup-blocked": "Your browser blocked the pop-up. Allow pop-ups for this site and try again.",
        "auth/operation-not-allowed": "Google sign-in is not enabled yet.",
        "auth/unauthorized-domain": "This domain is not authorized in Firebase."
      };
      showError(map[err.code] || err.message || "Google sign-in failed.");
      gBtn.disabled = false;
      gBtn.innerHTML = `<svg viewBox="0 0 48 48" width="18" height="18"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/></svg> Continue with Google`;
    }
  });

  // --------- Email registration ---------
  const form = $("#regForm");
  const submit = $("#submitBtn");

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    hideError();
    const name = $("#name").value.trim();
    const phone = $("#phone").value.trim();
    const email = $("#email").value.trim();
    const pass = $("#password").value;
    const confirm = $("#confirm").value;

    if(!name || name.length < 3) return showError("Please enter your full name.");
    if(!/^[+\d][\d\s-]{6,}$/.test(phone)) return showError("Please enter a valid phone number.");
    if(!/^\S+@\S+\.\S+$/.test(email)) return showError("Please enter a valid email.");
    if(pass.length < 6) return showError("Password must be at least 6 characters.");
    if(pass !== confirm) return showError("Passwords do not match.");
    if(!$("#agree").checked) return showError("You must accept the Terms and Risk Disclosure.");

    submit.disabled = true;
    submit.innerHTML = `<span class="spinner"></span> Creating account…`;

    try{
      await registerUser({ name, phone, email, password: pass });
      toast("Account created successfully", "success");
      setTimeout(()=> location.href = "dashboard.html", 700);
    }catch(err){
      const map = {
        "auth/email-already-in-use": "This email is already registered. Try signing in.",
        "auth/weak-password": "Please choose a stronger password.",
        "auth/invalid-email": "This email address is not valid.",
        "auth/network-request-failed": "Network error. Check your connection and try again."
      };
      showError(map[err.code] || err.message || "Registration failed.");
      submit.disabled = false;
      submit.textContent = "Create Account";
    }
  });
</script>
</body>
</html>
