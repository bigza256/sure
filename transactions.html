<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Transactions — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> / Transactions</div>
    <h1>Transaction Ledger</h1>
    <p>Append-only record of every balance change on your account.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="tabs" id="tabs"></div>

    <div class="responsive-table">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th><th>Balance after</th></tr></thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </div>
    <div class="mobile-list" id="txMobile"></div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $,
           formatUGX, formatDateTime, emptyState, esc } from "./js/ui.js";
  import { requireAuth } from "./js/auth.js";
  import { listBy, PATH } from "./js/database.js";

  const profile = await requireAuth("login.html");
  renderHeader({ user: profile, isAdmin: profile.role === "admin" });
  renderFooter();
  renderBottomNav({ user: profile, isAdmin: profile.role === "admin" });

  const TYPES = ["ALL","DEPOSIT","BET_STAKE","BET_RETURN","PROFIT_DISTRIBUTION",
                 "WITHDRAWAL","REFUND","ADJUSTMENT"];
  let active = "ALL";
  let all = (await listBy(PATH.transactions, "uid", profile.uid))
    .sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));

  function render(){
    const tabs = $("#tabs");
    tabs.innerHTML = TYPES.map(t=>
      `<button class="tab ${t===active?"active":""}" data-t="${t}">${t.replace(/_/g," ")}</button>`
    ).join("");
    tabs.querySelectorAll(".tab").forEach(b => b.onclick = ()=>{
      active = b.dataset.t; renderList();
      tabs.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x.dataset.t===active));
    });
    renderList();
  }

  function renderList(){
    const list = active === "ALL" ? all : all.filter(t=>t.type === active);
    const body = $("#txBody"), mob = $("#txMobile");
    if(!list.length){
      body.innerHTML = `<tr><td colspan="5">${emptyState("🧾","No transactions","Nothing matches this filter.")}</td></tr>`;
      mob.innerHTML  = emptyState("🧾","No transactions","Nothing matches this filter.");
      return;
    }
    body.innerHTML = list.map(t=>`
      <tr>
        <td>${formatDateTime(t.createdAt)}</td>
        <td><span class="badge badge-void">${esc(t.type)}</span></td>
        <td class="money ${(t.amount||0)>=0?"money-pos":"money-neg"}">${formatUGX(t.amount)}</td>
        <td style="color:var(--gray-600);font-size:.82rem">${esc(t.note||"—")}</td>
        <td class="money">${t.balanceAfter!=null?formatUGX(t.balanceAfter):"—"}</td>
      </tr>`).join("");
    mob.innerHTML = list.map(t=>`
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:6px">
          <span class="badge badge-void">${esc(t.type)}</span>
          <span class="money ${(t.amount||0)>=0?"money-pos":"money-neg"}">${formatUGX(t.amount)}</span>
        </div>
        <div style="font-size:.8rem;color:var(--gray-600)">${esc(t.note||"")}</div>
        <div style="font-size:.72rem;color:var(--gray-400);margin-top:4px">${formatDateTime(t.createdAt)} · After: ${t.balanceAfter!=null?formatUGX(t.balanceAfter):"—"}</div>
      </div>`).join("");
  }
  render();
</script>
</body>
</html>
