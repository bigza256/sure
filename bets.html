<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Bets — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb">Public</div>
    <h1>Betting Activity</h1>
    <p>Every bet — pending, live, and completed — with the odds actually entered by the admin.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="tabs" id="tabs">
      <button class="tab active" data-t="pending">Pending</button>
      <button class="tab" data-t="completed">Completed</button>
      <button class="tab" data-t="all">All</button>
    </div>

    <div id="betList" class="grid grid-2">
      <div class="card"><div class="skeleton sk-line"></div><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w40"></div></div>
      <div class="card"><div class="skeleton sk-line"></div><div class="skeleton sk-line w80"></div><div class="skeleton sk-line w40"></div></div>
    </div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $,
           formatUGX, formatDate, statusBadge, emptyState, esc } from "./js/ui.js";
  import { whenAuthReady } from "./js/auth.js";
  import { listAll, watch, PATH } from "./js/database.js";

  const profile = await whenAuthReady();
  renderHeader({ user: profile, isAdmin: profile?.role === "admin" });
  renderFooter();
  renderBottomNav({ user: profile, isAdmin: profile?.role === "admin" });

  let bets = [];
  let filter = "pending";

  function render(){
    const el = $("#betList");
    let list = bets.slice();
    if(filter === "pending")   list = list.filter(b => b.status === "pending");
    if(filter === "completed") list = list.filter(b => b.status === "completed");
    list.sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));

    if(!list.length){
      el.innerHTML = `<div class="card" style="grid-column:1/-1">${emptyState("🎯","No bets to show","Nothing matches this filter yet.")}</div>`;
      return;
    }
    el.innerHTML = list.map(b => {
      const result = b.result || b.status;
      return `
      <div class="match-card">
        <div class="match-teams">${esc(b.match || "—")}</div>
        <div class="match-meta">
          <span>🏆 ${esc(b.competition || "—")}</span>
          <span>📅 ${formatDate(b.matchDate || b.createdAt)}</span>
          <span>${statusBadge(result)}</span>
        </div>
        <div class="match-grid">
          <div class="cell"><div class="k">Market</div><div class="v" style="font-size:.82rem">${esc(b.market || "—")}</div></div>
          <div class="cell"><div class="k">Odds</div><div class="v">${esc(String(b.odds ?? "—"))}</div></div>
          <div class="cell"><div class="k">Stake</div><div class="v">${formatUGX(b.actualStake || b.plannedStake || 0)}</div></div>
        </div>
        ${b.status === "completed" ? `
          <div class="detail-row" style="margin-top:12px">
            <span class="k">Profit / Loss</span>
            <span class="v money ${(b.profitLoss||0)>=0?"money-pos":"money-neg"}">${formatUGX(b.profitLoss||0)}</span>
          </div>
          ${b.reference ? `<div class="detail-row"><span class="k">Reference</span><span class="v">${esc(b.reference)}</span></div>`:""}
        ` : `
          <div class="detail-row" style="margin-top:12px">
            <span class="k">Planned Stake</span>
            <span class="v">${formatUGX(b.plannedStake||0)}</span>
          </div>`}
      </div>`;
    }).join("");
  }

  $("#tabs").addEventListener("click", e=>{
    const t = e.target.closest(".tab"); if(!t) return;
    filter = t.dataset.t;
    $("#tabs").querySelectorAll(".tab").forEach(x=>x.classList.toggle("active", x===t));
    render();
  });

  watch(PATH.bets, (data)=>{
    bets = data ? Object.entries(data).map(([id,v])=>({id, ...v})) : [];
    render();
  });
</script>
</body>
</html>
