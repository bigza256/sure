<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Users — Admin — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb">Admin / Users</div>
    <h1>User Management</h1>
    <p>Search, verify, and manage contributors.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="card" style="margin-bottom:18px">
      <div class="form-row">
        <div class="form-group" style="margin:0">
          <label class="form-label">Search</label>
          <input class="form-control" id="search" placeholder="Name, email or phone">
        </div>
        <div class="form-group" style="margin:0">
          <label class="form-label">Filter</label>
          <select class="form-control" id="statusFilter">
            <option value="ALL">All</option>
            <option value="active">Active</option>
            <option value="suspended">Suspended</option>
            <option value="verified">Verified</option>
            <option value="unverified">Unverified</option>
          </select>
        </div>
      </div>
    </div>

    <div class="responsive-table">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Contact</th><th>Contribution</th><th>Reserve</th><th>Status</th><th>Verification</th><th></th></tr></thead>
          <tbody id="uBody"></tbody>
        </table>
      </div>
    </div>
    <div class="mobile-list" id="uMobile"></div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $, toast,
           formatUGX, formatDate, statusBadge, emptyState, esc, initials,
           openModal, closeModal, confirmDialog } from "../js/ui.js";
  import { requireAdmin } from "../js/auth.js";
  import { listAll, watch, updateItem, logActivity, notify, PATH } from "../js/database.js";

  const admin = await requireAdmin();
  renderHeader({ user: admin, isAdmin: true });
  renderFooter();
  renderBottomNav({ user: admin, isAdmin: true });

  let users = [], query = "", filter = "ALL";

  function render(){
    const src = users.slice().sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    const filtered = src.filter(u => {
      if(filter === "active" && u.status === "suspended") return false;
      if(filter === "suspended" && u.status !== "suspended") return false;
      if(filter === "verified" && u.verificationStatus !== "verified") return false;
      if(filter === "unverified" && u.verificationStatus === "verified") return false;
      if(!query) return true;
      const q = query.toLowerCase();
      return (u.name || "").toLowerCase().includes(q)
          || (u.email || "").toLowerCase().includes(q)
          || (u.phone || "").toLowerCase().includes(q);
    });

    if(!filtered.length){
      $("#uBody").innerHTML = `<tr><td colspan="7">${emptyState("👥","No users","Nothing matches.")}</td></tr>`;
      $("#uMobile").innerHTML = emptyState("👥","No users","Nothing matches.");
      return;
    }

    $("#uBody").innerHTML = filtered.map(u => {
      const w = u.wallets || {};
      return `
      <tr>
        <td>${esc(u.name || "—")}<div style="font-size:.72rem;color:var(--gray-400)">${esc(u.uid || "")}</div></td>
        <td>${esc(u.email || "")}<div style="font-size:.72rem;color:var(--gray-400)">${esc(u.phone || "")}</div></td>
        <td class="money">${formatUGX(w.totalContribution || 0)}</td>
        <td class="money">${formatUGX(w.protectedReserve || 0)}</td>
        <td>${statusBadge(u.status || "active")}</td>
        <td><span class="badge ${u.verificationStatus === "verified" ? "badge-active" : "badge-void"}">${esc(u.verificationStatus || "unverified")}</span></td>
        <td><button class="btn btn-sm btn-outline" data-view="${u.uid}" type="button">View</button></td>
      </tr>`;
    }).join("");

    $("#uMobile").innerHTML = filtered.map(u => {
      const w = u.wallets || {};
      return `
      <div class="card" style="padding:14px">
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
          <div class="avatar">${initials(u.name || "U")}</div>
          <div style="flex:1"><div style="font-weight:700">${esc(u.name || "—")}</div>
            <div style="font-size:.75rem;color:var(--gray-400)">${esc(u.email || "")}</div></div>
          ${statusBadge(u.status || "active")}
        </div>
        <div class="detail-row"><span class="k">Contribution</span><span class="v money">${formatUGX(w.totalContribution || 0)}</span></div>
        <div class="detail-row"><span class="k">Reserve</span><span class="v money">${formatUGX(w.protectedReserve || 0)}</span></div>
        <button class="btn btn-sm btn-outline" data-view="${u.uid}" type="button" style="margin-top:10px;width:100%">View</button>
      </div>`;
    }).join("");

    document.querySelectorAll("[data-view]").forEach(b => b.onclick = ()=> viewUser(b.dataset.view));
  }

  async function viewUser(uid){
    const u = users.find(x => x.uid === uid); if(!u) return;
    const w = u.wallets || {};
    const risk = u.riskState || { level: "NORMAL", reservePercent: 100 };

    openModal(`
      <div class="modal-head"><h3>${esc(u.name || "User")}</h3><button class="modal-close" data-close type="button">✕</button></div>
      <div class="detail-row"><span class="k">Email</span><span class="v">${esc(u.email || "—")}</span></div>
      <div class="detail-row"><span class="k">Phone</span><span class="v">${esc(u.phone || "—")}</span></div>
      <div class="detail-row"><span class="k">Provider</span><span class="v">${esc(u.provider || "—")}</span></div>
      <div class="detail-row"><span class="k">Created</span><span class="v">${formatDate(u.createdAt)}</span></div>
      <div class="detail-row"><span class="k">Status</span><span class="v">${statusBadge(u.status || "active")}</span></div>
      <div class="detail-row"><span class="k">Verification</span><span class="v">${esc(u.verificationStatus || "unverified")}</span></div>

      <h4 style="margin:14px 0 8px;font-size:.85rem;text-transform:uppercase;color:var(--gray-600)">Wallets</h4>
      <div class="detail-row"><span class="k">Total contribution</span><span class="v money">${formatUGX(w.totalContribution || 0)}</span></div>
      <div class="detail-row"><span class="k">Protected reserve</span><span class="v money">${formatUGX(w.protectedReserve || 0)}</span></div>
      <div class="detail-row"><span class="k">Available earnings</span><span class="v money">${formatUGX(w.availableEarnings || 0)}</span></div>
      <div class="detail-row"><span class="k">Active allocation</span><span class="v money">${formatUGX(w.activeAllocation || 0)}</span></div>
      <div class="detail-row"><span class="k">Total earnings</span><span class="v money">${formatUGX(w.totalEarningsGenerated || 0)}</span></div>
      <div class="detail-row"><span class="k">Total withdrawn</span><span class="v money">${formatUGX(w.totalWithdrawn || 0)}</span></div>
      <div class="detail-row"><span class="k">Company share</span><span class="v money">${formatUGX(w.companyShareContributed || 0)}</span></div>

      <h4 style="margin:14px 0 8px;font-size:.85rem;text-transform:uppercase;color:var(--gray-600)">Risk</h4>
      <div class="detail-row"><span class="k">Level</span><span class="v">${risk.level}</span></div>
      <div class="detail-row"><span class="k">Reserve %</span><span class="v">${(risk.reservePercent || 0).toFixed(1)}%</span></div>

      <div class="modal-actions" style="flex-direction:column;gap:8px;margin-top:16px">
        ${u.verificationStatus !== "verified"
          ? `<button class="btn btn-success" id="verifyBtn" type="button" style="width:100%">Mark Verified</button>` : ""}
        ${u.status === "suspended"
          ? `<button class="btn btn-success" id="reactBtn" type="button" style="width:100%">Reactivate</button>`
          : `<button class="btn btn-danger" id="susBtn" type="button" style="width:100%">Suspend</button>`}
      </div>
    `);

    const v = document.getElementById("verifyBtn");
    const s = document.getElementById("susBtn");
    const r = document.getElementById("reactBtn");
    v && (v.onclick = ()=> setVerification(u.uid, "verified"));
    s && (s.onclick = ()=> setStatus(u.uid, "suspended"));
    r && (r.onclick = ()=> setStatus(u.uid, "active"));
  }

  async function setVerification(uid, status){
    await updateItem(PATH.users, uid, { verificationStatus: status });
    await logActivity({ adminId: admin.uid, action: "USER_VERIFY", target: uid,
      prev: "unverified", next: status });
    await notify(uid, { type: "VERIFICATION", title: "Account verified", body: "Your account has been verified." });
    toast("Verification updated", "success");
    closeModal();
  }
  async function setStatus(uid, status){
    const u = users.find(x => x.uid === uid);
    const ok = await confirmDialog({
      title: status === "suspended" ? "Suspend user?" : "Reactivate user?",
      message: status === "suspended"
        ? "The user will not be able to log in or transact."
        : "The user will regain full access.",
      confirmText: status === "suspended" ? "Suspend" : "Reactivate",
      danger: status === "suspended"
    });
    if(!ok) return;
    await updateItem(PATH.users, uid, { status });
    await logActivity({ adminId: admin.uid, action: "USER_STATUS_CHANGE", target: uid,
      prev: u?.status || "active", next: status, note: u?.email || "" });
    toast(`User ${status}`, "success");
    closeModal();
  }

  $("#search").addEventListener("input", e => { query = e.target.value.trim(); render(); });
  $("#statusFilter").addEventListener("change", e => { filter = e.target.value; render(); });

  watch(PATH.users, (data)=>{
    users = data ? Object.entries(data).map(([uid,v]) => ({ uid, ...v })) : [];
    render();
  });
</script>
</body>
</html>
