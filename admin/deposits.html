<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Deposits — Admin — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .proof-thumb{width:100%;max-width:140px;border-radius:8px;border:1px solid var(--gray-200);cursor:pointer;transition:.15s}
  .proof-thumb.viewed{outline:3px solid var(--green);outline-offset:2px}
  .confirm-row{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:.85rem;color:var(--gray-600)}
  .designated-box{background:#f0f9ff;border:1px solid #bfdbfe;border-radius:var(--radius-sm);padding:12px;font-size:.82rem;margin:12px 0}
  .designated-box strong{color:#1e40af;display:block;margin-bottom:4px}
</style>
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb">Admin / Deposits</div>
    <h1>Deposit Approval</h1>
    <p>Verify each submission. Approving credits the user's wallets and creates the ledger records.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="tabs" id="tabs">
      <button class="tab active" data-s="PENDING"  type="button">Pending</button>
      <button class="tab"        data-s="APPROVED" type="button">Approved</button>
      <button class="tab"        data-s="REJECTED" type="button">Rejected</button>
      <button class="tab"        data-s="ALL"      type="button">All</button>
    </div>

    <div class="responsive-table">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Submitted</th><th>User</th><th>Amount</th>
              <th>Reference</th><th>Sender</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="depBody"></tbody>
        </table>
      </div>
    </div>
    <div class="mobile-list" id="depMobile"></div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $, toast,
           formatUGX, formatDateTime, statusBadge, emptyState, esc,
           confirmDialog, openModal, closeModal } from "../js/ui.js";
  import { requireAdmin } from "../js/auth.js";
  import { watch, approveDeposit, rejectDeposit, PATH } from "../js/database.js";
  import { loadConfig } from "../js/config.js";
  import { previewContribution } from "../js/calc.js";

  const admin = await requireAdmin();
  renderHeader({ user:admin, isAdmin:true });
  renderFooter();
  renderBottomNav({ user:admin, isAdmin:true });

  const config = await loadConfig();
  let filter = "PENDING";
  let deposits = [];
  const viewedProofs = new Set();

  function render(){
    const sorted = deposits.slice().sort((a,b)=> (b.submittedAt||0)-(a.submittedAt||0));
    const filtered = filter === "ALL" ? sorted : sorted.filter(d => d.status === filter);
    const body = $("#depBody");
    const mob  = $("#depMobile");

    if(!filtered.length){
      body.innerHTML = `<tr><td colspan="7">${emptyState("💵","No submissions","Nothing matches this filter.")}</td></tr>`;
      mob.innerHTML  = emptyState("💵","No submissions","Nothing matches this filter.");
      return;
    }

    body.innerHTML = filtered.map(d => `
      <tr>
        <td>${formatDateTime(d.submittedAt)}</td>
        <td>
          ${esc(d.userName || "—")}
          <div style="font-size:.72rem;color:var(--gray-400)">${esc(d.userEmail || "")}</div>
        </td>
        <td class="money">${formatUGX(d.amount)}</td>
        <td style="font-size:.8rem">${esc(d.paymentReference || "—")}</td>
        <td style="font-size:.8rem">${esc(d.senderPhone || "—")}</td>
        <td>${statusBadge(d.status)}</td>
        <td><button class="btn btn-sm btn-royal" data-review="${d.id}" type="button">Review</button></td>
      </tr>`).join("");

    mob.innerHTML = filtered.map(d => `
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <strong>${formatUGX(d.amount)}</strong>
          ${statusBadge(d.status)}
        </div>
        <div style="font-size:.82rem">${esc(d.userName || "—")}</div>
        <div style="font-size:.75rem;color:var(--gray-400)">Ref ${esc(d.paymentReference || "—")} · ${esc(d.senderPhone || "")}</div>
        <div style="font-size:.72rem;color:var(--gray-400)">${formatDateTime(d.submittedAt)}</div>
        <button class="btn btn-sm btn-royal" data-review="${d.id}" type="button" style="margin-top:10px;width:100%">Review</button>
      </div>`).join("");

    document.querySelectorAll("[data-review]").forEach(b => b.onclick = ()=> openReview(b.dataset.review));
  }

  function openReview(id){
    const d = deposits.find(x => x.id === id);
    if(!d) return;
    const isPending = d.status === "PENDING";
    const p = previewContribution(d.amount, config);

    openModal(`
      <div class="modal-head">
        <h3>Review deposit</h3>
        <button class="modal-close" data-close type="button">✕</button>
      </div>

      <div class="detail-row"><span class="k">User</span><span class="v">${esc(d.userName || d.userEmail || d.uid)}</span></div>
      <div class="detail-row"><span class="k">Amount</span><span class="v money">${formatUGX(d.amount)}</span></div>
      <div class="detail-row"><span class="k">Reference</span><span class="v" style="font-size:.8rem">${esc(d.paymentReference || "—")}</span></div>
      <div class="detail-row"><span class="k">Sender phone</span><span class="v">${esc(d.senderPhone || "—")}</span></div>
      <div class="detail-row"><span class="k">Submitted</span><span class="v" style="font-size:.82rem">${formatDateTime(d.submittedAt)}</span></div>

      <div class="designated-box">
        <strong>Designated MoMo shown to user</strong>
        ${esc(d.designatedMobileMoneyNumber || "—")}
        <div style="font-size:.72rem;color:#1e40af;margin-top:4px">
          Confirm the money actually arrived on this number before approving.
        </div>
      </div>

      ${d.proofUrl
        ? `<div style="margin:12px 0">
             <div class="form-label">Proof of payment — click to open and mark as reviewed</div>
             <img class="proof-thumb" id="proofImg" src="${esc(d.proofUrl)}" alt="Proof of payment">
           </div>`
        : `<div class="alert alert-warn" style="margin:12px 0"><span>ℹ️</span><div>No screenshot provided. Verify the reference against the Mobile Money statement before approving.</div></div>`}

      <h4 style="margin:16px 0 8px;font-size:.85rem;text-transform:uppercase;color:var(--gray-600)">Allocation preview</h4>
      <div class="detail-row"><span class="k">Active allocation (${config.activeAllocationPercent}%)</span><span class="v money">${formatUGX(p.activeAllocation)}</span></div>
      <div class="detail-row"><span class="k">Protected reserve (${config.reservePercent}%)</span><span class="v money">${formatUGX(p.protectedReserve)}</span></div>

      ${isPending ? `
        <label class="confirm-row">
          <input type="checkbox" id="confirmProof">
          <span>I have verified the payment reference / proof matches the submitted amount.</span>
        </label>
        <label class="confirm-row">
          <input type="checkbox" id="confirmMomo">
          <span>I have confirmed the money arrived on the designated Mobile Money number shown above.</span>
        </label>

        <div class="modal-actions" style="flex-direction:column;margin-top:16px">
          <button class="btn btn-success btn-block" id="approveBtn" type="button" disabled>Approve &amp; credit user</button>
          <button class="btn btn-danger btn-block" id="rejectBtn" type="button">Reject</button>
        </div>
      ` : `
        <div style="margin-top:16px;font-size:.85rem;color:var(--gray-600)">
          Reviewed by ${esc(d.reviewedBy || "—")} on ${formatDateTime(d.reviewedAt)}.
          ${d.rejectionReason ? `<br><strong>Reason:</strong> ${esc(d.rejectionReason)}` : ""}
        </div>`}
    `);

    if(!isPending) return;

    const approveBtn = $("#approveBtn");
    const c1 = $("#confirmProof"), c2 = $("#confirmMomo");

    const refresh = ()=>{
      const proofOk = !d.proofUrl || viewedProofs.has(d.id);
      approveBtn.disabled = !(c1.checked && c2.checked && proofOk);
    };

    const img = $("#proofImg");
    img && img.addEventListener("click", ()=>{
      viewedProofs.add(d.id);
      img.classList.add("viewed");
      refresh();
    });
    c1.addEventListener("change", refresh);
    c2.addEventListener("change", refresh);
    refresh();

    approveBtn.onclick = ()=> doApprove(d);
    $("#rejectBtn").onclick = ()=> doReject(d);
  }

  async function doApprove(d){
    const ok = await confirmDialog({
      title: "Approve deposit?",
      message: `${formatUGX(d.amount)} will be credited to <strong>${esc(d.userName || d.userEmail)}</strong>. This creates the contribution, cycle, and ledger entries and cannot be undone.`,
      confirmText: "Approve"
    });
    if(!ok) return;
    try{
      await approveDeposit({ deposit: d, adminUid: admin.uid, config });
      toast("Deposit approved and user credited", "success");
      closeModal();
    }catch(err){
      toast(err.message || "Approval failed", "error");
    }
  }

  async function doReject(d){
    const reason = prompt("Reason for rejection (visible to the user):");
    if(reason === null) return;
    try{
      await rejectDeposit({ deposit: d, adminUid: admin.uid, reason: reason.trim() });
      toast("Deposit rejected", "warn");
      closeModal();
    }catch(err){
      toast(err.message || "Rejection failed", "error");
    }
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if(!t) return;
    filter = t.dataset.s;
    $("#tabs").querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    render();
  });

  watch(PATH.depositSubmissions, (data)=>{
    deposits = data ? Object.entries(data).map(([id,v]) => ({ id, ...v })) : [];
    render();
  });
</script>
</body>
</html>
