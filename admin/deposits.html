<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Deposits — Admin — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .proof-img{max-width:100%;max-height:340px;border-radius:12px;border:1px solid var(--gray-200);object-fit:contain;background:#f4f6fb}
  .verify-gate{background:var(--amber-bg);border:1px solid #fde68a;border-radius:10px;padding:12px;font-size:.85rem;color:#78350f;margin:12px 0}
  .verify-gate.ok{background:var(--green-bg);border-color:#bbf7d0;color:#166534}
</style>
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb">Admin / Deposits</div>
    <h1>Deposit Management</h1>
    <p>Verify each submission against the designated number before approving.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="tabs" id="tabs">
      <button class="tab active" data-s="PENDING"  type="button">Pending</button>
      <button class="tab"        data-s="PROCESSING" type="button">Processing</button>
      <button class="tab"        data-s="APPROVED" type="button">Approved</button>
      <button class="tab"        data-s="REJECTED" type="button">Rejected</button>
      <button class="tab"        data-s="ALL"      type="button">All</button>
    </div>

    <div class="responsive-table">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>User</th><th>Amount</th><th>Reference</th><th>Sender</th><th>Status</th><th></th></tr></thead>
          <tbody id="depBody"></tbody>
        </table>
      </div>
    </div>
    <div class="mobile-list" id="depMobile"></div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $, toast,
           formatUGX, formatDateTime, statusBadge, emptyState, esc,
           openModal, closeModal, confirmDialog } from "../js/ui.js";
  import { requireAdmin } from "../js/auth.js";
  import { loadSystemConfig } from "../js/config.js";
  import { calculateActiveAllocation, calculateProtectedReserve,
           calculateReservePercent, calculateRiskLevel } from "../js/calc.js";
  import { listAll, watch, updateItem, pushItem, logActivity, notify,
           PATH } from "../js/database.js";
  import { writeLedgerEntry } from "../js/ledger.js";
  import { db, ref, runTransaction } from "../js/firebase.js";

  const admin = await requireAdmin();
  renderHeader({ user: admin, isAdmin: true });
  renderFooter();
  renderBottomNav({ user: admin, isAdmin: true });

  let filter = "PENDING";
  let deposits = [];
  const config = await loadSystemConfig();

  function render(){
    const sorted = deposits.slice().sort((a,b) => (b.submittedAt || 0) - (a.submittedAt || 0));
    const filtered = filter === "ALL" ? sorted : sorted.filter(d => d.status === filter);
    const body = $("#depBody"), mob = $("#depMobile");

    if(!filtered.length){
      body.innerHTML = `<tr><td colspan="7">${emptyState("💵","No deposits","Nothing matches this filter.")}</td></tr>`;
      mob.innerHTML = emptyState("💵","No deposits","Nothing matches this filter.");
      return;
    }

    body.innerHTML = filtered.map(d => `
      <tr>
        <td>${formatDateTime(d.submittedAt)}</td>
        <td>${esc(d.userName || "—")}<div style="font-size:.75rem;color:var(--gray-400)">${esc(d.userEmail || "")}</div></td>
        <td class="money">${formatUGX(d.amount)}</td>
        <td style="font-size:.8rem">${esc(d.paymentReference || "—")}</td>
        <td style="font-size:.8rem">${esc(d.senderPhone || "—")}</td>
        <td>${statusBadge(d.status)}</td>
        <td>
          ${(d.status === "PENDING" || d.status === "PROCESSING")
            ? `<button class="btn btn-sm btn-royal" data-view="${d.id}" type="button">Review</button>`
            : `<span style="font-size:.75rem;color:var(--gray-400)">${esc(d.reviewedBy || "—")}</span>`}
        </td>
      </tr>`).join("");

    mob.innerHTML = filtered.map(d => `
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <strong>${formatUGX(d.amount)}</strong>
          ${statusBadge(d.status)}
        </div>
        <div style="font-size:.82rem">${esc(d.userName || "—")}</div>
        <div style="font-size:.75rem;color:var(--gray-400)">Ref ${esc(d.paymentReference || "—")}</div>
        <div style="font-size:.72rem;color:var(--gray-400)">${formatDateTime(d.submittedAt)}</div>
        ${(d.status === "PENDING" || d.status === "PROCESSING")
          ? `<button class="btn btn-sm btn-royal" data-view="${d.id}" type="button" style="margin-top:10px;width:100%">Review</button>`
          : ""}
      </div>`).join("");

    document.querySelectorAll("[data-view]").forEach(b => b.onclick = ()=> openReview(b.dataset.view));
  }

  async function openReview(id){
    const d = deposits.find(x => x.id === id);
    if(!d) return;

    const proofHtml = d.proofUrl
      ? `<img src="${esc(d.proofUrl)}" alt="Proof of payment" class="proof-img" id="proofImg">`
      : `<div style="padding:20px;text-align:center;color:var(--gray-400);border:1px dashed var(--gray-200);border-radius:10px">No proof uploaded</div>`;

    openModal(`
      <div class="modal-head"><h3>Review deposit</h3><button class="modal-close" data-close type="button">✕</button></div>

      <div class="detail-row"><span class="k">User</span><span class="v">${esc(d.userName || "—")}</span></div>
      <div class="detail-row"><span class="k">Email</span><span class="v">${esc(d.userEmail || "—")}</span></div>
      <div class="detail-row"><span class="k">Amount claimed</span><span class="v money">${formatUGX(d.amount)}</span></div>
      <div class="detail-row"><span class="k">Reference</span><span class="v">${esc(d.paymentReference)}</span></div>
      <div class="detail-row"><span class="k">Sender phone</span><span class="v">${esc(d.senderPhone || "—")}</span></div>
      <div class="detail-row"><span class="k">Designated MoMo shown to user</span><span class="v">${esc(d.designatedMobileMoneyNumber || "—")}</span></div>
      <div class="detail-row"><span class="k">Submitted</span><span class="v">${formatDateTime(d.submittedAt)}</span></div>
      <div class="detail-row"><span class="k">Current designated MoMo</span><span class="v">${esc((config.designatedMobileMoney || {}).number || "—")}</span></div>

      <div style="margin:14px 0">${proofHtml}</div>

      <div class="verify-gate" id="gate">
        <strong>Before approving, verify:</strong>
        <label style="display:flex;gap:8px;margin-top:8px"><input type="checkbox" id="c1"> I have confirmed the payment was received on the designated MoMo number</label>
        <label style="display:flex;gap:8px;margin-top:6px"><input type="checkbox" id="c2"> I have matched the reference and amount to the network confirmation</label>
      </div>

      <div class="modal-actions" style="flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px;width:100%">
          <button class="btn btn-success" id="approveBtn" type="button" disabled style="flex:1">Approve</button>
          <button class="btn btn-danger"  id="rejectBtn"  type="button" style="flex:1">Reject</button>
        </div>
        <button class="btn btn-outline" id="clarifyBtn" type="button">Request clarification</button>
      </div>
    `);

    const enable = ()=>{ const ok = $("#c1").checked && $("#c2").checked;
      $("#approveBtn").disabled = !ok;
      $("#gate").classList.toggle("ok", ok); };
    $("#c1").onchange = enable;
    $("#c2").onchange = enable;

    $("#approveBtn").onclick = ()=> approve(d.id);
    $("#rejectBtn").onclick  = ()=> reject(d.id);
    $("#clarifyBtn").onclick = ()=> clarify(d.id);
  }

  // ---------- Atomic approval ----------
  async function approve(depositId){
    try{
      // Step 1: atomically claim the deposit (PENDING → PROCESSING)
      let claimed = null;
      const depRef = ref(db, `${PATH.depositSubmissions}/${depositId}`);
      const result = await runTransaction(depRef, (d)=>{
        if(!d) return;
        if(d.status !== "PENDING") return; // abort — someone else got it
        d.status = "PROCESSING";
        d.reviewedBy = admin.uid;
        d.reviewedAt = Date.now();
        claimed = d;
        return d;
      });
      if(!result.committed || !claimed){
        toast("This deposit is no longer pending.", "warn");
        closeModal();
        return;
      }

      const d = claimed;
      const allocation = calculateActiveAllocation(d.amount, config);
      const reserve    = calculateProtectedReserve(d.amount, config);

      // Step 2: atomically credit wallets
      const walletRef = ref(db, `${PATH.users}/${d.uid}/wallets`);
      const walletResult = await runTransaction(walletRef, (w)=>{
        if(!w) return;
        const prevActive  = w.activeAllocation || 0;
        const prevReserve = w.protectedReserve || 0;
        const prevContrib = w.totalContribution || 0;
        w.activeAllocation = prevActive + allocation;
        w.protectedReserve = prevReserve + reserve;
        w.totalContribution = prevContrib + d.amount;
        return w;
      });
      if(!walletResult.committed){
        // rollback: mark deposit back to PENDING so admin can retry
        await updateItem(PATH.depositSubmissions, depositId, { status: "PENDING", reviewedBy: null, reviewedAt: null });
        throw new Error("Could not credit wallets. Deposit reset to PENDING.");
      }

      const newWallets = walletResult.snapshot.val();

      // Step 3: create contribution record
      const contributionId = await pushItem(PATH.contributions, {
        uid: d.uid,
        cycleId: (await listAll(PATH.cycles)).find(c => c.uid === d.uid && c.status === "ACTIVE")?.id || "",
        amount: d.amount,
        depositId,
        activeAllocation: allocation,
        protectedReserve: reserve,
        status: "ACTIVE",
        createdAt: Date.now(),
        approvedBy: admin.uid,
        approvedAt: Date.now()
      });

      // Step 4: append immutable ledger entries
      const ledgerBase = {
        uid: d.uid, cycleId: "", actor: admin.uid,
        referenceId: contributionId, currency: "UGX"
      };
      await writeLedgerEntry({
        ...ledgerBase, type: "CONTRIBUTION",
        amount: d.amount, wallet: "activeAllocation",
        previousBalance: (newWallets.totalContribution || 0) - d.amount,
        newBalance: newWallets.totalContribution,
        note: "Contribution received"
      });
      await writeLedgerEntry({
        ...ledgerBase, type: "ACTIVE_ALLOCATION",
        amount: allocation, wallet: "activeAllocation",
        previousBalance: (newWallets.activeAllocation || 0) - allocation,
        newBalance: newWallets.activeAllocation,
        note: `Active allocation ${config.activeAllocationPercent}%`
      });
      await writeLedgerEntry({
        ...ledgerBase, type: "RESERVE_ADDITION",
        amount: reserve, wallet: "protectedReserve",
        previousBalance: (newWallets.protectedReserve || 0) - reserve,
        newBalance: newWallets.protectedReserve,
        note: `Protected reserve ${config.reservePercent}%`
      });

      // Step 5: recompute risk level
      const reservePct = calculateReservePercent(newWallets.protectedReserve || 0, newWallets.activeAllocation || 0);
      const riskLevel = calculateRiskLevel(reservePct, config);
      await updateItem(PATH.users, d.uid, {
        riskState: { level: riskLevel, reservePercent: reservePct, lastEvaluatedAt: Date.now() }
      });

      // Step 6: mark APPROVED
      await updateItem(PATH.depositSubmissions, depositId, {
        status: "APPROVED",
        relatedContributionId: contributionId
      });

      // Step 7: notify + audit
      await notify(d.uid, {
        type: "DEPOSIT_APPROVED",
        title: "Contribution received",
        body: `Your contribution of ${formatUGX(d.amount)} has been approved.`,
        meta: { depositId, contributionId }
      });
      await logActivity({
        adminId: admin.uid, action: "APPROVE_DEPOSIT", target: depositId,
        prev: "PROCESSING", next: "APPROVED",
        note: `${formatUGX(d.amount)} for ${d.userEmail}`
      });

      toast("Deposit approved and credited", "success");
      closeModal();
    }catch(err){
      toast(err.message || "Approval failed", "error");
    }
  }

  async function reject(depositId){
    const d = deposits.find(x => x.id === depositId);
    const reason = prompt("Reason for rejection (visible to user):");
    if(!reason || reason.trim().length < 3){ toast("Reason required", "warn"); return; }

    const ok = await confirmDialog({
      title: "Reject deposit?",
      message: "The user will see this as rejected. No balance change will occur.",
      confirmText: "Reject", danger: true
    });
    if(!ok) return;

    await updateItem(PATH.depositSubmissions, depositId, {
      status: "REJECTED",
      reviewedBy: admin.uid,
      reviewedAt: Date.now(),
      rejectionReason: reason.trim()
    });
    await notify(d.uid, {
      type: "DEPOSIT_REJECTED",
      title: "Contribution rejected",
      body: `Your submission of ${formatUGX(d.amount)} was rejected: ${reason.trim()}`,
      meta: { depositId }
    });
    await logActivity({
      adminId: admin.uid, action: "REJECT_DEPOSIT", target: depositId,
      prev: "PENDING", next: "REJECTED", note: reason.trim()
    });
    toast("Deposit rejected", "warn");
    closeModal();
  }

  async function clarify(depositId){
    const d = deposits.find(x => x.id === depositId);
    const msg = prompt("Clarification message for the user:");
    if(!msg) return;
    await notify(d.uid, {
      type: "DEPOSIT_CLARIFICATION",
      title: "Clarification needed",
      body: msg,
      meta: { depositId }
    });
    await logActivity({
      adminId: admin.uid, action: "DEPOSIT_CLARIFICATION", target: depositId,
      note: msg
    });
    toast("Clarification sent", "success");
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if(!t) return;
    filter = t.dataset.s;
    $("#tabs").querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    render();
  });

  watch(PATH.depositSubmissions, (data)=>{
    deposits = data ? Object.entries(data).map(([id,v]) => ({ id, ...v })) : [];
    render();
  });
</script>
</body>
</html>
