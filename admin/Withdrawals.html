<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Withdrawals — Admin — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb">Admin / Withdrawals</div>
    <h1>Withdrawal Management</h1>
    <p>Review, process, or reject withdrawal requests manually.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="tabs" id="tabs">
      <button class="tab active" data-s="PENDING"    type="button">Pending</button>
      <button class="tab"        data-s="PROCESSING" type="button">Processing</button>
      <button class="tab"        data-s="COMPLETED"  type="button">Completed</button>
      <button class="tab"        data-s="REJECTED"   type="button">Rejected</button>
      <button class="tab"        data-s="ALL"        type="button">All</button>
    </div>

    <div class="responsive-table">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>User</th><th>Amount</th>
              <th>MoMo</th><th>Status</th><th></th>
            </tr>
          </thead>
          <tbody id="wBody"></tbody>
        </table>
      </div>
    </div>
    <div class="mobile-list" id="wMobile"></div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $, toast,
           formatUGX, formatDateTime, statusBadge, emptyState, esc,
           confirmDialog } from "../js/ui.js";
  import { requireAdmin } from "../js/auth.js";
  import { listAll, watch, updateItem, adjustBalance, logActivity,
           PATH } from "../js/database.js";

  const admin = await requireAdmin();
  renderHeader({ user:admin, isAdmin:true });
  renderFooter();
  renderBottomNav({ user:admin, isAdmin:true });

  let filter = "PENDING";
  let list = [];

  function render(){
    const sorted = list.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    const filtered = filter === "ALL" ? sorted : sorted.filter(w => w.status === filter);
    const body = $("#wBody");
    const mob  = $("#wMobile");

    if(!filtered.length){
      body.innerHTML = `<tr><td colspan="6">${emptyState("🏦","No withdrawal requests","Nothing matches this filter.")}</td></tr>`;
      mob.innerHTML  = emptyState("🏦","No withdrawal requests","Nothing matches this filter.");
      return;
    }

    body.innerHTML = filtered.map(w => `
      <tr>
        <td>${formatDateTime(w.createdAt)}</td>
        <td>
          ${esc(w.userName || "—")}
          <div style="font-size:.75rem;color:var(--gray-400)">${esc(w.userEmail || "")}</div>
        </td>
        <td class="money">${formatUGX(w.amount)}</td>
        <td style="font-size:.8rem">
          ${esc(w.momo || "—")}
          <div style="font-size:.72rem;color:var(--gray-400)">${esc(w.accountName || "")}</div>
        </td>
        <td>${statusBadge(w.status)}</td>
        <td>
          ${w.status === "PENDING"
            ? `<button class="btn btn-sm btn-success" data-p="${w.id}" type="button">Process</button>
               <button class="btn btn-sm btn-danger"  data-r="${w.id}" type="button" style="margin-left:6px">Reject</button>`
            : w.status === "PROCESSING"
              ? `<button class="btn btn-sm btn-primary" data-c="${w.id}" type="button">Complete</button>`
              : ""}
        </td>
      </tr>`).join("");

    mob.innerHTML = filtered.map(w => `
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <strong>${formatUGX(w.amount)}</strong>
          ${statusBadge(w.status)}
        </div>
        <div style="font-size:.82rem">${esc(w.userName || "—")}</div>
        <div style="font-size:.75rem;color:var(--gray-400)">${esc(w.momo || "")} · ${formatDateTime(w.createdAt)}</div>
        <div style="display:flex;gap:8px;margin-top:12px">
          ${w.status === "PENDING"
            ? `<button class="btn btn-sm btn-success" data-p="${w.id}" type="button" style="flex:1">Process</button>
               <button class="btn btn-sm btn-danger"  data-r="${w.id}" type="button" style="flex:1">Reject</button>`
            : ""}
          ${w.status === "PROCESSING"
            ? `<button class="btn btn-sm btn-primary" data-c="${w.id}" type="button" style="flex:1">Mark completed</button>`
            : ""}
        </div>
      </div>`).join("");

    document.querySelectorAll("[data-p]").forEach(b => b.onclick = ()=> markProcessing(b.dataset.p));
    document.querySelectorAll("[data-c]").forEach(b => b.onclick = ()=> markCompleted(b.dataset.c));
    document.querySelectorAll("[data-r]").forEach(b => b.onclick = ()=> reject(b.dataset.r));
  }

  async function markProcessing(id){
    await updateItem(PATH.withdrawals, id, {
      status: "PROCESSING",
      processedBy: admin.uid,
      processedAt: Date.now()
    });
    await logActivity({
      adminId: admin.uid, action: "WITHDRAWAL_PROCESSING", target: id,
      prev: "PENDING", next: "PROCESSING"
    });
    toast("Marked as processing", "success");
  }

  async function markCompleted(id){
    const w = list.find(x => x.id === id);
    if(!w) return;

    const ok = await confirmDialog({
      title: "Mark completed?",
      message: `${formatUGX(w.amount)} will be debited from <strong>${esc(w.userName || "the user")}</strong>'s available balance and a ledger entry recorded.`,
      confirmText: "Complete"
    });
    if(!ok) return;

    try{
      await adjustBalance(w.uid, -w.amount, {
        type: "WITHDRAWAL",
        reference: w.id,
        note: "Withdrawal completed",
        createdBy: admin.uid
      });

      const users = await listAll(PATH.users);
      const u = users.find(x => x.uid === w.uid);
      await updateItem(PATH.users, w.uid, {
        totalWithdrawn: (u?.totalWithdrawn || 0) + w.amount
      });

      await updateItem(PATH.withdrawals, id, {
        status: "COMPLETED",
        completedBy: admin.uid,
        completedAt: Date.now()
      });

      await logActivity({
        adminId: admin.uid, action: "WITHDRAWAL_COMPLETED", target: id,
        prev: "PROCESSING", next: "COMPLETED",
        note: `${formatUGX(w.amount)} for ${w.userEmail}`
      });

      toast("Withdrawal completed", "success");
    }catch(err){
      toast(err.message || "Failed", "error");
    }
  }

  async function reject(id){
    const w = list.find(x => x.id === id);
    const ok = await confirmDialog({
      title: "Reject withdrawal?",
      message: "The user will see the request as rejected. No balance change will be made.",
      confirmText: "Reject", danger: true
    });
    if(!ok) return;

    await updateItem(PATH.withdrawals, id, {
      status: "REJECTED",
      processedBy: admin.uid,
      processedAt: Date.now()
    });
    await logActivity({
      adminId: admin.uid, action: "WITHDRAWAL_REJECTED", target: id,
      prev: "PENDING", next: "REJECTED", note: w?.momo || ""
    });
    toast("Withdrawal rejected", "warn");
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if(!t) return;
    filter = t.dataset.s;
    $("#tabs").querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    render();
  });

  watch(PATH.withdrawals, (data)=>{
    list = data ? Object.entries(data).map(([id,v]) => ({ id, ...v })) : [];
    render();
  });
</script>
</body>
</html>
