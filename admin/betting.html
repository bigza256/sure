<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Bet Manager — Admin — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb">Admin / Bet Manager</div>
    <h1>Bet Manager</h1>
    <p>Create pool bets, then record the result. WIN/LOSS distributes to user wallets.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3 style="margin:0">Create pending bet</h3></div>
      <div id="formError" class="alert alert-error" style="display:none"></div>
      <form id="betForm">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Match</label>
            <input class="form-control" id="match" required placeholder="Manchester United vs Arsenal">
          </div>
          <div class="form-group">
            <label class="form-label">Competition</label>
            <input class="form-control" id="competition" required placeholder="Premier League">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Match date</label>
            <input class="form-control" id="matchDate" type="date" required>
          </div>
          <div class="form-group">
            <label class="form-label">Market</label>
            <input class="form-control" id="market" required placeholder="Match Result">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Odds</label>
            <input class="form-control" id="odds" type="number" step="0.01" min="1.01" required placeholder="1.80">
          </div>
          <div class="form-group">
            <label class="form-label">Planned stake (UGX)</label>
            <input class="form-control" id="plannedStake" type="number" min="0" step="1000" required placeholder="50000">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Betting platform reference (optional)</label>
            <input class="form-control" id="reference" placeholder="e.g. BOLT-88231">
          </div>
          <div class="form-group">
            <label class="form-label">Evidence URL (optional)</label>
            <input class="form-control" id="evidence" placeholder="https://…">
          </div>
        </div>
        <button class="btn btn-primary btn-lg" id="createBtn" type="submit">Create Pending Bet</button>
      </form>
    </div>

    <div class="card">
      <div class="card-head"><h3 style="margin:0">All bets</h3></div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-s="pending"   type="button">Pending</button>
        <button class="tab"        data-s="completed" type="button">Completed</button>
        <button class="tab"        data-s="ALL"       type="button">All</button>
      </div>

      <div class="responsive-table">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Created</th><th>Match</th><th>Odds</th>
                <th>Stake</th><th>Result</th><th>P/L</th><th></th>
              </tr>
            </thead>
            <tbody id="betBody"></tbody>
          </table>
        </div>
      </div>
      <div class="mobile-list" id="betMobile"></div>
    </div>

  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $, toast,
           formatUGX, formatDate, statusBadge, emptyState, esc,
           openModal, closeModal, confirmDialog } from "../js/ui.js";
  import { requireAdmin } from "../js/auth.js";
  import { watch, updateItem, pushItem, logActivity, listAll,
           recordBetWin, recordBetLoss, PATH } from "../js/database.js";
  import { loadConfig } from "../js/config.js";

  const admin = await requireAdmin();
  renderHeader({ user:admin, isAdmin:true });
  renderFooter();
  renderBottomNav({ user:admin, isAdmin:true });

  const config = await loadConfig();

  let bets = [];
  let filter = "pending";

  // ---- Create bet ----
  $("#betForm").addEventListener("submit", async e => {
    e.preventDefault();
    const errBox = $("#formError");
    errBox.style.display = "none";

    const match        = $("#match").value.trim();
    const competition  = $("#competition").value.trim();
    const matchDate    = $("#matchDate").value;
    const market       = $("#market").value.trim();
    const odds         = Number($("#odds").value);
    const plannedStake = Number($("#plannedStake").value);
    const reference    = $("#reference").value.trim();
    const evidence     = $("#evidence").value.trim();

    if(!match || !competition || !market){
      errBox.textContent = "Please complete all required fields.";
      errBox.style.display = "flex"; return;
    }
    if(!odds || odds <= 1){
      errBox.textContent = "Odds must be greater than 1.";
      errBox.style.display = "flex"; return;
    }
    if(!plannedStake || plannedStake < 0){
      errBox.textContent = "Planned stake must be ≥ 0.";
      errBox.style.display = "flex"; return;
    }

    try{
      const id = await pushItem(PATH.betRecords, {
        match,
        competition,
        matchDate: matchDate ? new Date(matchDate).getTime() : null,
        market,
        odds,
        plannedStake,
        reference: reference || null,
        evidence:  evidence  || null,
        status: "pending",
        result: null,
        actualStake: null,
        profitLoss: null,
        createdBy: admin.uid,
        createdAt: Date.now(),
        closedAt: null
      });
      await logActivity({
        adminId: admin.uid, action: "CREATE_BET", target: id,
        note: `${match} @ ${odds}`
      });
      toast("Bet created", "success");
      e.target.reset();
    }catch(err){
      errBox.textContent = err.message || "Could not create bet.";
      errBox.style.display = "flex";
    }
  });

  // ---- List ----
  function render(){
    const sorted = bets.slice().sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
    const filtered = filter === "ALL" ? sorted : sorted.filter(b => b.status === filter);
    const body = $("#betBody");
    const mob  = $("#betMobile");

    if(!filtered.length){
      body.innerHTML = `<tr><td colspan="7">${emptyState("🎯","No bets","Nothing matches this filter.")}</td></tr>`;
      mob.innerHTML  = emptyState("🎯","No bets","Nothing matches this filter.");
      return;
    }

    body.innerHTML = filtered.map(b => `
      <tr>
        <td>${formatDate(b.createdAt)}</td>
        <td>
          ${esc(b.match)}
          <div style="font-size:.75rem;color:var(--gray-400)">${esc(b.market || "")}</div>
        </td>
        <td>${esc(String(b.odds))}</td>
        <td class="money">${formatUGX(b.actualStake || b.plannedStake || 0)}</td>
        <td>${statusBadge(b.result || b.status)}</td>
        <td class="money ${(b.profitLoss||0) >= 0 ? "money-pos" : "money-neg"}">
          ${b.status === "completed" ? formatUGX(b.profitLoss || 0) : "—"}
        </td>
        <td>
          ${b.status === "pending"
            ? `<button class="btn btn-sm btn-royal" data-manage="${b.id}" type="button">Manage</button>`
            : ""}
        </td>
      </tr>`).join("");

    mob.innerHTML = filtered.map(b => `
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <strong style="font-size:.92rem">${esc(b.match)}</strong>
          ${statusBadge(b.result || b.status)}
        </div>
        <div style="font-size:.78rem;color:var(--gray-600)">${esc(b.market || "")} · Odds ${esc(String(b.odds))}</div>
        <div style="font-size:.78rem;color:var(--gray-600)">Stake ${formatUGX(b.actualStake || b.plannedStake || 0)}</div>
        ${b.status === "pending"
          ? `<button class="btn btn-sm btn-royal" data-manage="${b.id}" type="button" style="margin-top:10px;width:100%">Manage</button>`
          : ""}
      </div>`).join("");

    document.querySelectorAll("[data-manage]").forEach(el => el.onclick = () => openManage(el.dataset.manage));
  }

  // ---- Manage modal ----
  function openManage(id){
    const b = bets.find(x => x.id === id);
    if(!b) return;

    openModal(`
      <div class="modal-head">
        <h3>Manage bet</h3>
        <button class="modal-close" data-close type="button">✕</button>
      </div>
      <p style="font-size:.88rem;color:var(--gray-600);margin-bottom:14px">
        ${esc(b.match)} · ${esc(b.market || "")} · Odds ${esc(String(b.odds))}
      </p>
      <div class="form-group">
        <label class="form-label">Actual stake (UGX)</label>
        <input class="form-control" id="mStake" type="number" min="0" step="1000" value="${b.plannedStake||0}">
      </div>
      <div class="form-group">
        <label class="form-label">Odds (actual)</label>
        <input class="form-control" id="mOdds" type="number" step="0.01" min="1.01" value="${b.odds||1.8}">
      </div>
      <div class="form-group">
        <label class="form-label">Reference (optional)</label>
        <input class="form-control" id="mRef" value="${esc(b.reference||"")}">
      </div>
      <div class="form-group">
        <label class="form-label">Evidence URL (optional)</label>
        <input class="form-control" id="mEvid" value="${esc(b.evidence||"")}">
      </div>
      <div class="modal-actions" style="flex-direction:column;gap:8px">
        <div style="display:flex;gap:8px">
          <button class="btn btn-success" id="mWin"  type="button" style="flex:1">Mark WIN</button>
          <button class="btn btn-danger"  id="mLoss" type="button" style="flex:1">Mark LOSS</button>
          <button class="btn btn-ghost"   id="mVoid" type="button" style="flex:1">Mark VOID</button>
        </div>
      </div>
    `);

    const gather = () => ({
      stake: Number($("#mStake").value),
      odds:  Number($("#mOdds").value),
      ref:   $("#mRef").value.trim(),
      evid:  $("#mEvid").value.trim()
    });

    $("#mWin").onclick = async () => {
      const { stake, odds, ref, evid } = gather();
      if(stake <= 0 || odds <= 1) return toast("Invalid stake/odds", "error");
      await finalize(b.id, { stake, odds, ref, evid, result: "WIN", profitLoss: Math.round(stake*odds - stake) });
    };
    $("#mLoss").onclick = async () => {
      const { stake, odds, ref, evid } = gather();
      if(stake <= 0 || odds <= 1) return toast("Invalid stake/odds", "error");
      await finalize(b.id, { stake, odds, ref, evid, result: "LOSS", profitLoss: -stake });
    };
    $("#mVoid").onclick = async () => {
      const { stake, odds, ref, evid } = gather();
      await finalize(b.id, { stake, odds, ref, evid, result: "VOID", profitLoss: 0 });
    };
  }

  // ---- Finalize: distributes to user wallets via atomic workflows ----
  async function finalize(id, { stake, odds, ref, evid, result, profitLoss }){
    const b = bets.find(x => x.id === id);
    if(!b) return;

    const ok = await confirmDialog({
      title: `Mark as ${result}?`,
      message: result === "VOID"
        ? "This will close the bet with no balance changes."
        : `This will distribute the ${result} to all users with active allocations and cannot be undone.`,
      confirmText: "Confirm"
    });
    if(!ok) return;

    closeModal();

    try{
      // Load all users with active allocation
      const users = await listAll(PATH.users);
      const active = users.filter(u =>
        (u.wallets?.activeAllocation || 0) > 0 && u.currentCycleId
      );

      if(result === "WIN" || result === "LOSS"){
        if(!active.length){
          toast("No users with active allocations — bet closed without distribution", "warn");
        } else {
          const totalAlloc = active.reduce((s, u) => s + (u.wallets.activeAllocation || 0), 0);
          for(const u of active){
            const alloc = u.wallets.activeAllocation || 0;
            const share = Math.floor(stake * (alloc / Math.max(1, totalAlloc)));
            if(share <= 0) continue;
            if(result === "WIN"){
              await recordBetWin({
                uid: u.uid, cycleId: u.currentCycleId,
                stake: share, odds,
                adminUid: admin.uid, config, betId: id
              });
            } else {
              await recordBetLoss({
                uid: u.uid, cycleId: u.currentCycleId,
                stake: share, odds,
                adminUid: admin.uid, config, betId: id
              });
            }
          }
          toast(`Bet ${result} — distributed to ${active.length} user(s)`, "success");
        }
      } else {
        toast("Bet marked VOID", "success");
      }

      // Close the bet record
      await updateItem(PATH.betRecords, id, {
        actualStake: stake,
        odds,
        reference: ref || null,
        evidence:  evid || null,
        status: "completed",
        result,
        profitLoss,
        closedAt: Date.now(),
        closedBy: admin.uid
      });

      await logActivity({
        adminId: admin.uid,
        action: `BET_${result}`,
        target: id,
        prev: { odds: b.odds, status: b.status },
        next: { odds, status: "completed", result, profitLoss },
        note: b.match
      });
    }catch(err){
      console.error(err);
      toast(err.message || "Distribution failed", "error");
    }
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if(!t) return;
    filter = t.dataset.s;
    $("#tabs").querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    render();
  });

  watch(PATH.betRecords, (data) => {
    bets = data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : [];
    render();
  });
</script>
</body>
</html>
