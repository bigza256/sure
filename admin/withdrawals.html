<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Withdrawals — Admin — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="header"></div>

<section class="page-header">
  <div class="container">
    <div class="breadcrumb">Admin / Withdrawals</div>
    <h1>Withdrawal Management</h1>
    <p>Review, process, or reject. Balance is only debited when you mark COMPLETED.</p>
  </div>
</section>

<main class="section-tight">
  <div class="container">
    <div class="tabs" id="tabs">
      <button class="tab active" data-s="REQUESTED"  type="button">Requested</button>
      <button class="tab"        data-s="PROCESSING" type="button">Processing</button>
      <button class="tab"        data-s="COMPLETED"  type="button">Completed</button>
      <button class="tab"        data-s="REJECTED"   type="button">Rejected</button>
      <button class="tab"        data-s="ALL"        type="button">All</button>
    </div>

    <div class="responsive-table">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Requested</th><th>User</th><th>Amount</th><th>Account</th><th>Status</th><th></th></tr></thead>
          <tbody id="wBody"></tbody>
        </table>
      </div>
    </div>
    <div class="mobile-list" id="wMobile"></div>
  </div>
</main>

<div id="footer"></div>
<div id="bottomNav"></div>

<script type="module">
  import { renderHeader, renderFooter, renderBottomNav, $, toast,
           formatUGX, formatDateTime, statusBadge, emptyState, esc,
           confirmDialog } from "../js/ui.js";
  import { requireAdmin } from "../js/auth.js";
  import { watch, PATH } from "../js/database.js";
  import { transitionWithdrawal } from "../js/withdrawals.js";

  const admin = await requireAdmin();
  renderHeader({ user:admin, isAdmin:true });
  renderFooter();
  renderBottomNav({ user:admin, isAdmin:true });

  let filter = "REQUESTED";
  let list = [];

  const NEXT = {
    REQUESTED:  [["PENDING","Mark pending"],["APPROVED","Approve"],["REJECTED","Reject"]],
    PENDING:    [["APPROVED","Approve"],["REJECTED","Reject"]],
    APPROVED:   [["PROCESSING","Mark processing"],["REJECTED","Reject"]],
    PROCESSING: [["COMPLETED","Mark completed"],["REJECTED","Reject"]]
  };

  function render(){
    const sorted = list.slice().sort((a,b) => (b.requestedAt||0) - (a.requestedAt||0));
    const filtered = filter === "ALL" ? sorted : sorted.filter(w => w.status === filter);
    const body = $("#wBody");
    const mob  = $("#wMobile");

    if(!filtered.length){
      body.innerHTML = `<tr><td colspan="6">${emptyState("🏦","No withdrawals","Nothing matches this filter.")}</td></tr>`;
      mob.innerHTML = emptyState("🏦","No withdrawals","Nothing matches this filter.");
      return;
    }

    const buttons = (w) => (NEXT[w.status] || []).map(([to, label]) => {
      const cls = to === "REJECTED" ? "btn-danger"
                : to === "COMPLETED" ? "btn-success"
                : "btn-primary";
      return `<button class="btn btn-sm ${cls}" data-act="${w.id}" data-to="${to}" type="button">${label}</button>`;
    }).join(" ");

    body.innerHTML = filtered.map(w => `
      <tr>
        <td>${formatDateTime(w.requestedAt)}</td>
        <td>${esc(w.userName || "—")}<div style="font-size:.72rem;color:var(--gray-400)">${esc(w.userEmail || "")}</div></td>
        <td class="money">${formatUGX(w.amount)}</td>
        <td style="font-size:.8rem">${esc(w.accountNumber || "")}<div style="font-size:.72rem;color:var(--gray-400)">${esc(w.accountName || "")}</div></td>
        <td>${statusBadge(w.status)}</td>
        <td>${buttons(w)}</td>
      </tr>`).join("");

    mob.innerHTML = filtered.map(w => `
      <div class="card" style="padding:14px">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <strong>${formatUGX(w.amount)}</strong>
          ${statusBadge(w.status)}
        </div>
        <div style="font-size:.82rem">${esc(w.userName || "—")}</div>
        <div style="font-size:.75rem;color:var(--gray-400)">${esc(w.accountNumber || "")} · ${formatDateTime(w.requestedAt)}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px">${buttons(w)}</div>
      </div>`).join("");

    document.querySelectorAll("[data-act]").forEach(b => b.onclick = ()=> act(b.dataset.act, b.dataset.to));
  }

  async function act(wid, to){
    const w = list.find(x => x.id === wid);
    if(!w) return;

    if(to === "COMPLETED"){
      const ok = await confirmDialog({
        title: "Mark completed?",
        message: `${formatUGX(w.amount)} will be debited from ${esc(w.userName)}'s available earnings and a ledger entry recorded.`,
        confirmText: "Complete"
      });
      if(!ok) return;
    }
    if(to === "REJECTED"){
      const reason = prompt("Reason for rejection:");
      if(reason === null) return;
      return void doTransition(wid, to, reason.trim());
    }
    await doTransition(wid, to, "");
  }

  async function doTransition(wid, to, reason){
    try{
      await transitionWithdrawal({ wid, adminUid: admin.uid, to, reason });
      toast(`Marked ${to}`, "success");
    }catch(err){
      toast(err.message || "Failed", "error");
    }
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if(!t) return;
    filter = t.dataset.s;
    $("#tabs").querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x === t));
    render();
  });

  watch(PATH.withdrawals, (data)=>{
    list = data ? Object.entries(data).map(([id,v]) => ({ id, ...v })) : [];
    render();
  });
</script>
</body>
</html>
