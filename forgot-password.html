<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1430">
<title>Reset Password — SURE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="header"></div>
<main class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo" style="color:var(--navy-900)"><span class="logo-mark">S</span>SU<span style="color:var(--gold-dark)">RE</span></span></div>
    <h1>Reset your password</h1>
    <p class="sub">We'll email you a secure reset link.</p>

    <div id="alertBox"></div>

    <form id="resetForm" novalidate>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" required autocomplete="email">
      </div>
      <button class="btn btn-primary btn-block btn-lg" id="submitBtn">Send Reset Link</button>
    </form>

    <div class="auth-foot"><a href="login.html">Back to sign in</a></div>
  </div>
</main>
<div id="footer"></div>

<script type="module">
  import { renderHeader, renderFooter, $ } from "./js/ui.js";
  import { resetPassword } from "./js/auth.js";

  renderHeader({});
  renderFooter();

  const form = $("#resetForm");
  const box  = $("#alertBox");
  const btn  = $("#submitBtn");

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    box.innerHTML = "";
    const email = $("#email").value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){
      box.innerHTML = `<div class="alert alert-error">Please enter a valid email address.</div>`;
      return;
    }
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span> Sending…`;
    try{
      await resetPassword(email);
      box.innerHTML = `<div class="alert alert-success">Reset link sent. Check your inbox (and spam folder).</div>`;
    }catch(err){
      box.innerHTML = `<div class="alert alert-error">${err.message || "Could not send reset email."}</div>`;
    }finally{
      btn.disabled = false; btn.textContent = "Send Reset Link";
    }
  });
</script>
</body>
</html>
